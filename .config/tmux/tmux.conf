##### Core ###########################################################

# Use default tmux prefix: Ctrl-b.
# Ctrl-b Ctrl-b sends a literal Ctrl-b to the app/shell.
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes at 1.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Use fish inside tmux.
set -g default-shell /usr/bin/fish

# Better interactive feel.
set -g escape-time 10
set -g focus-events on
set -g history-limit 100000

# When the current session is destroyed, detach back to fish
# instead of jumping into another existing tmux session.
set -g detach-on-destroy on

# Let terminal apps distinguish modified keys like Ctrl/Alt/Shift+Enter.
set -g extended-keys on
set -g extended-keys-format csi-u

# Avoid bell/activity visual noise from tmux.
set -g visual-bell off
set -g bell-action none
setw -g monitor-bell off
setw -g monitor-activity off
set -g visual-activity off

##### Mouse selection behavior ######################################

# Let the mouse wheel scroll tmux history.
set -g mouse on

# Let mouse drag select in tmux copy-mode, but do NOT auto-copy on mouse release.
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Disable tmux's auto-copy-on-double/triple-click behavior.
unbind -T root DoubleClick1Pane
unbind -T root TripleClick1Pane
unbind -T copy-mode DoubleClick1Pane
unbind -T copy-mode TripleClick1Pane
unbind -T copy-mode-vi DoubleClick1Pane
unbind -T copy-mode-vi TripleClick1Pane

# Rebind double/triple click to select only, without copying.
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line }
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# Let tmux copy selections to the KDE/Wayland clipboard.
set -s copy-command 'wl-copy'
bind -T copy-mode C-S-c send -X copy-pipe-and-cancel
bind -T copy-mode-vi C-S-c send -X copy-pipe-and-cancel
bind -T copy-mode Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# Right-click copies the active tmux selection.
bind -T copy-mode    MouseDown3Pane if -F '#{selection_present}' 'send -X copy-pipe-and-cancel'
bind -T copy-mode-vi MouseDown3Pane if -F '#{selection_present}' 'send -X copy-pipe-and-cancel'

# Truecolor support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,konsole*:RGB,alacritty*:RGB,foot*:RGB,kitty*:RGB,wezterm*:RGB,ghostty*:RGB"

# Keep Wayland/KDE environment variables updated inside tmux.
set -ga update-environment "DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR KDE_FULL_SESSION SSH_AUTH_SOCK OP_INJECTED OP_SKIPPED"

##### Windows ########################################################

# New window in the current pane's directory.
bind c new-window -c "#{pane_current_path}"

# Prefix + number switches windows by default:
#   Ctrl-a 1
#   Ctrl-a 2
#   Ctrl-a 3
# etc.

# Easier previous/next window.
bind Tab next-window
bind BTab previous-window

# Window/session pickers.
bind w choose-tree -w
bind s choose-tree -s

##### Panes ##########################################################

# Intuitive splits.
unbind '"'
unbind %

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with Alt+WASD, no prefix needed.
bind -n M-a select-pane -L
bind -n M-d select-pane -R
bind -n M-w select-pane -U
bind -n M-s select-pane -D

# Pane movement uses tmux defaults:
#   Ctrl-a Left
#   Ctrl-a Right
#   Ctrl-a Up
#   Ctrl-a Down

# Pane resizing also uses tmux defaults:
#   Ctrl-a Ctrl-Left
#   Ctrl-a Ctrl-Right
#   Ctrl-a Ctrl-Up
#   Ctrl-a Ctrl-Down

# Zoom current pane.
bind z resize-pane -Z

# Toggle synchronized input to all panes in the current window.
bind S setw synchronize-panes \; display-message "sync panes: #{?pane_synchronized,on,off}"

##### Quality of life ################################################

# Enter copy/scroll mode.
bind [ copy-mode
bind -T copy-mode Space send -X begin-selection # start with Space
bind -T copy-mode Enter send -X copy-pipe-and-cancel # copy with Enter

# Reload tmux config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Simple status line.
set -g status-interval 2
set -g status-position bottom
set -g status-left " #S │ "
set -g status-right " │ %Y-%m-%d %-I:%M %p "

##### Plugins ########################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-battery'

# Theme (monochrome)
set -g @tmux_power_theme '#a8a8a8'
set -g @tmux_power_g0 '#040404'
set -g @tmux_power_g1 '#1c1c1c'
set -g @tmux_power_g2 '#262626'
set -g @tmux_power_g3 '#3a3a3a'
set -g @tmux_power_g4 '#eeeeee'

# Status bar
set -g @tmux_power_left_a '#S'
set -g @tmux_power_left_b ''
set -g @tmux_power_left_c ''
set -g @tmux_power_left_d ''
set -g @tmux_power_right_w '#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load -i2 -a0 -g0)  #{battery_percentage}'
set -g @tmux_power_right_x ''
set -g @tmux_power_right_y '%F'
set -g @tmux_power_right_z '%I:%M %p'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
